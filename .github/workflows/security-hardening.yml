name: Security hardening checks

on:
  push:
    branches:
      - security-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n x-ui-latest.sh x-ui-patch.sh assets/xray-forward-sync.sh
      - name: Test forwarding allowlist synchronization
        run: python3 tests/test_forward_sync.py
      - name: Install Nginx for routing test
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Test Nginx forwarding restrictions
        run: python3 tests/test_forward_map_nginx.py
